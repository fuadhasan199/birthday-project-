<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>birthday wises 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--night:#14081f;--plum:#3a1250;--gold:#ffc875;--rose:#ff6f91;--cream:#fff1dc}
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--cream);font-family:'Hind Siliguri',sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:2}
h1,h2,#wish{font-family:'Tiro Bangla',serif;font-style:italic;font-weight:400;line-height:1.3}
#gate h2{font-size:clamp(2rem,8vw,3.4rem);margin-bottom:28px;color:var(--gold)}
button{font:600 1.1rem 'Hind Siliguri';border:0;border-radius:99px;padding:15px 38px;background:var(--gold);color:var(--night);cursor:pointer;box-shadow:0 0 40px #ffc87588;transition:transform .2s}
button:active{transform:scale(.95)}
button:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
#stage{display:none;opacity:0;transition:opacity 2s}
h1{font-size:clamp(3rem,13vw,6.5rem);text-shadow:0 0 40px #ff6f9188;margin-bottom:8px}
h1 span{display:block;color:var(--gold);font-size:.6em}
#hint{font-size:1rem;opacity:.8;margin:6px 0 4px;transition:opacity .6s}
#cake{width:min(300px,72vw);cursor:pointer;filter:drop-shadow(0 0 50px #ff6f9166)}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .18s ease-in-out infinite alternate;transition:opacity .4s}
.fl:nth-child(2n){animation-duration:.23s}
@keyframes fl{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.85,1.15) rotate(4deg)}}
.off .fl{opacity:0}
#wish{max-width:460px;margin-top:10px;font-size:1.05rem;line-height:1.7;min-height:0;white-space:pre-line;opacity:0;transition:opacity 1s}
#wish.on{opacity:1}
#mute{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:5;width:44px;height:44px;padding:0;font-size:1.2rem;display:none;background:#ffffff22;color:var(--cream);box-shadow:none}
@media(prefers-reduced-motion:reduce){.fl{animation:none}} 
#stage{justify-content:flex-start;padding-top:calc(24px + env(safe-area-inset-top,0px));overflow-y:auto}
#cake{width:min(200px,50vw)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="music">🔊</button>

<div class="layer" id="gate">
  <h2>আপনার জন্য ছোট্ট <br class="margin-top" style="margin-top: 5px;">  একটা সারপ্রাইজ আছে </h2>
  <button id="go">এখানে ক্লিক করুন </button>
</div>

<div class="layer" id="stage">
  <h1>শুভ জন্মদিন<span id="nm"></span></h1>
  <p id="hint">কেক এ ক্লিক করুন  </p>
  <svg id="cake" viewBox="0 0 300 260" role="button" aria-label="Blow candles">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9fb8"/><stop offset="1" stop-color="#ff6f91"/></linearGradient>
      <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3b8"/><stop offset="1" stop-color="#ffc875"/></linearGradient>
      <radialGradient id="gl"><stop offset="0" stop-color="#ffc875" stop-opacity=".8"/><stop offset="1" stop-color="#ffc875" stop-opacity="0"/></radialGradient>
    </defs>
    <ellipse cx="150" cy="238" rx="130" ry="12" fill="#0006"/>
    <rect x="30" y="160" width="240" height="76" rx="16" fill="url(#g2)"/>
    <path d="M30 176q20 22 40 0t40 0 40 0 40 0 40 0 40 0v-6H30z" fill="#fff1dc"/>
    <rect x="62" y="108" width="176" height="62" rx="14" fill="url(#g1)"/>
    <path d="M62 124q22 22 44 0t44 0 44 0 44 0v-8H62z" fill="#fff1dc"/>
    <g fill="#ffc875"><circle cx="90" cy="205" r="5"/><circle cx="150" cy="210" r="5"/><circle cx="210" cy="205" r="5"/></g>
    <g fill="#ff6f91"><circle cx="120" cy="150" r="4"/><circle cx="180" cy="150" r="4"/></g>
    <g id="cs">
      <g><rect x="92" y="68" width="10" height="42" rx="3" fill="#8fd3f4"/><g class="fl"><circle cx="97" cy="52" r="26" fill="url(#gl)"/><path d="M97 40q9 11 0 22-9-11 0-22z" fill="#ffd36e"/></g></g>
      <g><rect x="125" y="58" width="10" height="52" rx="3" fill="#fbc2eb"/><g class="fl"><circle cx="130" cy="42" r="26" fill="url(#gl)"/><path d="M130 30q9 11 0 22-9-11 0-22z" fill="#ffd36e"/></g></g>
      <g><rect x="145" y="52" width="10" height="58" rx="3" fill="#fff1dc"/><g class="fl"><circle cx="150" cy="36" r="26" fill="url(#gl)"/><path d="M150 24q9 11 0 22-9-11 0-22z" fill="#ffd36e"/></g></g>
      <g><rect x="165" y="58" width="10" height="52" rx="3" fill="#fbc2eb"/><g class="fl"><circle cx="170" cy="42" r="26" fill="url(#gl)"/><path d="M170 30q9 11 0 22-9-11 0-22z" fill="#ffd36e"/></g></g>
      <g><rect x="198" y="68" width="10" height="42" rx="3" fill="#8fd3f4"/><g class="fl"><circle cx="203" cy="52" r="26" fill="url(#gl)"/><path d="M203 40q9 11 0 22-9-11 0-22z" fill="#ffd36e"/></g></g>
    </g>
  </svg>
  <p id="wish"></p>
</div>

<audio id="a" src="HB.webm" loop preload="auto"></audio>

<script>
const NAME = "আপু";
const TEXT = `শুভ জন্মদিন, আপু! 🎉

আল্লাহ আপনাকে সবসময় সুস্থ, সুখী ও হাসিখুশি রাখুন।
আপনার জীবনের প্রতিটি মুহূর্ত ভরে উঠুক আনন্দ, শান্তি ও সাফল্যে।
আগামীর দিনগুলো হোক আরও সুন্দর, স্বপ্নময় এবং কল্যাণে ভরা। 🌸

—ফুয়াদ হাসান পরাগ`;

const $ = id => document.getElementById(id);
const cv = $("c"), x = cv.getContext("2d");
let W, H, D = Math.min(devicePixelRatio || 1, 2);
const R = Math.random;
function size(){ W = innerWidth; H = innerHeight; cv.width = W*D; cv.height = H*D; x.setTransform(D,0,0,D,0,0); }
addEventListener("resize", size); size();

const stars = Array.from({length: 120}, () => ({x:R()*W, y:R()*H, r:R()*1.4+.3, p:R()*6}));
const lanterns = Array.from({length: 9}, () => lan(true));
function lan(init){ return {x:R()*W, y: init ? R()*H : H+60, s:14+R()*16, v:.25+R()*.4, p:R()*6, h:R()>.5?28:340}; }
let rockets = [], sparks = [], confetti = [], celebrate = false, t = 0;

function burst(px, py){
  const h = R()*360, n = 70;
  for(let i=0;i<n;i++){
    const a = i/n*Math.PI*2, v = 2+R()*3.2;
    sparks.push({x:px, y:py, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, h:h+R()*40});
  }
}
function launch(){ rockets.push({x:W*(.15+R()*.7), y:H, ty:H*(.12+R()*.35), vy:-7-R()*3}); }
function pop(){
  for(let i=0;i<140;i++) confetti.push({x:R()*W, y:-20-R()*H*.5, vx:R()*2-1, vy:2+R()*3, r:R()*6, w:4+R()*6, c:`hsl(${R()*360},90%,65%)`});
}

function frame(){
  t += .016;
  x.fillStyle = "rgba(20,8,31,.28)"; x.fillRect(0,0,W,H);
  for(const s of stars){ x.globalAlpha = .4 + .6*Math.abs(Math.sin(t+s.p)); x.fillStyle = "#fff1dc"; x.beginPath(); x.arc(s.x,s.y,s.r,0,7); x.fill(); }
  x.globalAlpha = 1;
  lanterns.forEach((l,i) => {
    l.y -= l.v; l.x += Math.sin(t+l.p)*.3;
    if(l.y < -80) lanterns[i] = lan(false);
    const g = x.createRadialGradient(l.x,l.y,0,l.x,l.y,l.s*3);
    g.addColorStop(0,`hsla(${l.h},100%,70%,.45)`); g.addColorStop(1,"transparent");
    x.fillStyle = g; x.fillRect(l.x-l.s*3,l.y-l.s*3,l.s*6,l.s*6);
    x.fillStyle = `hsl(${l.h},95%,62%)`;
    x.beginPath(); x.roundRect(l.x-l.s/2, l.y-l.s*.7, l.s, l.s*1.4, l.s*.3); x.fill();
  });
  if(celebrate){
    if(R()<.04) launch();
    rockets = rockets.filter(r => { r.y += r.vy; x.fillStyle="#ffc875"; x.fillRect(r.x,r.y,2,8); if(r.y<=r.ty){burst(r.x,r.y);return false} return true; });
    sparks = sparks.filter(s => { s.x+=s.vx; s.y+=s.vy; s.vy+=.04; s.vx*=.985; s.life-=.014; x.fillStyle=`hsla(${s.h},100%,65%,${s.life})`; x.fillRect(s.x,s.y,2.4,2.4); return s.life>0; });
    confetti = confetti.filter(c => { c.x+=c.vx+Math.sin(t*3+c.r); c.y+=c.vy; x.save(); x.translate(c.x,c.y); x.rotate(t*3+c.r); x.fillStyle=c.c; x.fillRect(-c.w/2,-c.r/2,c.w,c.r); x.restore(); return c.y<H+20; });
  }
  requestAnimationFrame(frame);
}
x.fillStyle = "#14081f"; x.fillRect(0,0,W,H);
frame();

$("nm").textContent = NAME + " 🎂";
const a = $("a");
$("go").onclick = () => {
  a.play().catch(()=>{});
  $("gate").style.display = "none";
  $("mute").style.display = "block";
  const s = $("stage"); s.style.display = "flex";
  requestAnimationFrame(() => s.style.opacity = 1);
};
$("mute").onclick = e => { a.paused ? a.play() : a.pause(); e.target.textContent = a.paused ? "🔇" : "🔊"; };

let done = false;
$("cake").onclick = () => {
  if(done) return; done = true;
  $("cake").classList.add("off");
  $("hint").style.opacity = 0;
  celebrate = true; pop(); for(let i=0;i<4;i++) setTimeout(launch, i*300);
  setTimeout(pop, 2500);
  const w = $("wish"); w.classList.add("on");
  let i = 0;
  (function type(){ w.textContent = TEXT.slice(0,i++); if(i<=TEXT.length) setTimeout(type, 55); })();
};
</script>
</body>
</html>
